server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: task-management-java
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
  rate-limit:
    signup:
      capacity: ${RATE_LIMIT_SIGNUP_CAPACITY:5}
      window: ${RATE_LIMIT_SIGNUP_WINDOW:60s}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      window: ${RATE_LIMIT_LOGIN_WINDOW:60s}
    api:
      capacity: ${RATE_LIMIT_API_CAPACITY:100}
      window: ${RATE_LIMIT_API_WINDOW:60s}
